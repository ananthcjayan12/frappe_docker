version: '3'

services:
  # 1. API GATEWAY (Nginx)
  # Even though your React App is on Cloudflare, you NEED this.
  # It routes API requests (https://staging-api.../api/...) to the Backend.
 # 1. API GATEWAY (Nginx)
  frontend:
      image: 'ghcr.io/ananthcjayan12/frappe-custom-mobclinic:latest'
      pull_policy: always
      restart: unless-stopped
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8080/api/method/ping"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 40s
      command:
        - nginx-entrypoint.sh
      environment:
        BACKEND: 'backend:8000'
        FRAPPE_SITE_NAME_HEADER: staging.dentcharts.com
        SOCKETIO: 'websocket:9000'
        UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
        CLIENT_MAX_BODY_SIZE: 50m
      volumes:
        - 'sites:/home/frappe/frappe-bench/sites'
        # THE FIX: These two lines create writable temporary folders
        - type: tmpfs
          target: /run
          tmpfs:
            size: 100m
        - type: tmpfs
          target: /var/cache/nginx
          tmpfs:
            size: 100m
      depends_on:
        - backend
        - websocket
      ports:
        - '8305:8080'
      # THE FIX: Run as Root to bypass permission errors
      user: "0:0"

  # 2. APPLICATION SERVER (Gunicorn)
  backend:
    image: 'ghcr.io/ananthcjayan12/frappe-custom-mobclinic:latest'
    pull_policy: always
    restart: unless-stopped
    deploy:
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    volumes:
      - 'sites:/home/frappe/frappe-bench/sites'
    environment:
      DB_HOST: db
      DB_PORT: '3306'
      MYSQL_ROOT_PASSWORD: admin
      MARIADB_ROOT_PASSWORD: admin
      REDIS_CACHE: 'redis-cache:6379'
      REDIS_QUEUE: 'redis-queue:6379'
      SOCKETIO_PORT: '9000'

  # 3. AUTO-MIGRATOR (Runs once on deploy, then stops)
  # This ensures your Staging DB is always in sync with your code.
  configurator:
    image: 'ghcr.io/ananthcjayan12/frappe-custom-mobclinic:latest'
    pull_policy: always
    restart: "no"
    deploy:
      restart_policy:
        condition: none
    entrypoint:
      - bash
      - '-c'
    command:
      - |
        echo "⏳ Waiting for services..."
        sleep 10
        if [ -d "sites/staging.dentcharts.com" ]; then
          echo "🚀 Site found! Running 'bench migrate'..."
          bench --site staging.dentcharts.com migrate
          echo "✅ Migration Complete."
        else
          echo "⚠️ Site 'staging.dentcharts.com' not found. Skipping migration."
          echo "👉 If this is the first run, please create the site manually."
        fi
    volumes:
      - 'sites:/home/frappe/frappe-bench/sites'
    environment:
      DB_HOST: db
      DB_PORT: '3306'
      REDIS_CACHE: 'redis-cache:6379'
      REDIS_QUEUE: 'redis-queue:6379'

  # 4. UNIFIED WORKER (Saves RAM)
  # Combines all queues into one process
  worker:
    image: 'ghcr.io/ananthcjayan12/frappe-custom-mobclinic:latest'
    pull_policy: always
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - bench
      - worker
      - '--queue'
      - 'short,default,long'
    volumes:
      - 'sites:/home/frappe/frappe-bench/sites'

  # 5. SCHEDULER
  scheduler:
    image: 'ghcr.io/ananthcjayan12/frappe-custom-mobclinic:latest'
    pull_policy: always
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - bench
      - schedule
    volumes:
      - 'sites:/home/frappe/frappe-bench/sites'

  # 6. WEBSOCKET
  websocket:
    image: 'ghcr.io/ananthcjayan12/frappe-custom-mobclinic:latest'
    pull_policy: always
    restart: unless-stopped
    deploy:
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    volumes:
      - 'sites:/home/frappe/frappe-bench/sites'

  # 7. DATABASE & CACHE
  db:
    image: 'mariadb:10.6'
    deploy:
      restart_policy:
        condition: on-failure
    healthcheck:
      test: mysqladmin ping -h localhost --password=admin
      interval: 1s
      retries: 20
    command:
      - '--character-set-server=utf8mb4'
      - '--collation-server=utf8mb4_unicode_ci'
      - '--skip-character-set-client-handshake'
      - '--skip-innodb-read-only-compressed'
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MARIADB_ROOT_PASSWORD: admin
    volumes:
      - 'db-data:/var/lib/mysql'

  redis-queue:
    image: 'redis:6.2-alpine'
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - 'redis-queue-data:/data'

  redis-cache:
    image: 'redis:6.2-alpine'
    deploy:
      restart_policy:
        condition: on-failure

volumes:
  db-data:
  redis-queue-data:
  sites: