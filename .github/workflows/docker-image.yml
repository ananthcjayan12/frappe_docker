name: Build and Push Docker Image
permissions:
  contents: write
  packages: write

on:
  workflow_dispatch:
    inputs:
      frappe_path:
        description: 'Frappe repository URL'
        required: false
        default: 'https://github.com/frappe/frappe'
      frappe_branch:
        description: 'Frappe branch to use'
        required: false
        default: 'version-15'
      image_tag:
        description: 'Image tag to push (overrides default)'
        required: false
        default: ''
  push:
    branches:
      - main
      - br-v5
    tags:
      - 'v*'

jobs:
  build:
    env:
      IMAGE_TAG: v${{ github.run_number }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Get latest rentalgenie commit hash
        id: rentalgenie_hash
        run: |
          RENTALGENIE_HASH=$(curl -s https://api.github.com/repos/ananthcjayan12/rentalgenie/commits/develop | jq -r .sha)
          echo "rentalgenie_hash=${RENTALGENIE_HASH}" >> $GITHUB_OUTPUT
          echo "Latest rentalgenie commit: ${RENTALGENIE_HASH}"
      - name: Encode apps.json
        id: encode_apps
        run: |
          echo "apps_json_base64=$(base64 -w0 apps.json)" >> $GITHUB_OUTPUT
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: linux/amd64,linux/arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}
      - name: Pull cache image if available
        run: |
          docker pull ghcr.io/ananthcjayan12/frappe-custom:${{ env.IMAGE_TAG }} || echo "No cache image found"

      - name: Build and push Docker image
        run: |
          docker build \
            --file images/layered/Containerfile \
            --cache-from ghcr.io/ananthcjayan12/frappe-custom:${{ env.IMAGE_TAG }} \
            --build-arg CACHEBUST=${{ github.run_id }}-${{ steps.rentalgenie_hash.outputs.rentalgenie_hash }} \
            --build-arg FRAPPE_PATH=${{ github.event_name == 'workflow_dispatch' && inputs.frappe_path || 'https://github.com/frappe/frappe' }} \
            --build-arg FRAPPE_BRANCH=${{ github.event_name == 'workflow_dispatch' && inputs.frappe_branch || 'version-15' }} \
            --build-arg APPS_JSON_BASE64="${{ steps.encode_apps.outputs.apps_json_base64 }}" \
            --tag ghcr.io/ananthcjayan12/frappe-custom:${{ env.IMAGE_TAG }} \
            .

          docker push ghcr.io/ananthcjayan12/frappe-custom:${{ env.IMAGE_TAG }}
      - name: Commit pwd.yml update
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          sed -i "s/\${IMAGE_TAG}/${IMAGE_TAG}/g" pwd.yml
          git add pwd.yml
          git commit -m "ci: update pwd.yml to ${IMAGE_TAG}" || echo "No changes to commit"
          git pull --rebase origin ${BRANCH_NAME}
          git push origin ${BRANCH_NAME} 