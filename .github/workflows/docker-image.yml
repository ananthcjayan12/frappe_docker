name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      frappe_path:
        description: 'Frappe repository URL'
        required: false
        default: 'https://github.com/frappe/frappe'
      frappe_branch:
        description: 'Frappe branch to use'
        required: false
        default: 'version-15'
      image_tag:
        description: 'Image tag to push (overrides default)'
        required: false
        default: ''
  push:
    branches:
      - main
      - br-v5
    tags:
      - 'v*'

jobs:
  build:
    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Encode apps.json
        id: encode_apps
        run: |
          echo "apps_json_base64=$(base64 -w0 apps.json)" >> $GITHUB_OUTPUT
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: linux/amd64,linux/arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: images/layered/Containerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            FRAPPE_PATH=${{ github.event_name == 'workflow_dispatch' && inputs.frappe_path || 'https://github.com/frappe/frappe' }}
            FRAPPE_BRANCH=${{ github.event_name == 'workflow_dispatch' && inputs.frappe_branch || 'version-15' }}
            APPS_JSON_BASE64=${{ steps.encode_apps.outputs.apps_json_base64 }}
          tags: |
            ghcr.io/ananthcjayan12/frappe-custom:${{ env.IMAGE_TAG }}
            ghcr.io/ananthcjayan12/frappe-custom:latest 